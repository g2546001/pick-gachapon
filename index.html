ex:9;opacity:0;pointer-events:none;transform:translate(-50%,-35px) scale(.4)}.capsule-fall.falling{opacity:1;animation:fall 1.15s cubic-bezier(.2,.6,.35,1) forwards}.capsule-fall.ready{opacity:1;transform:translate(-50%,83px) scale(1);pointer-events:auto;cursor:pointer}.capsule-fall svg{width:100%;height:100%;filter:drop-shadow(0 8px 6px #0002)}.capsule-fall.opening{animation:none;transform:translate(-50%,65px) scale(1.25);opacity:1;pointer-events:none}.cap-top,.cap-bottom{transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .5s;transform-box:fill-box;transform-origin:center}.opening .cap-top{transform:translateY(-36px) rotate(-19deg)}.opening .cap-bottom{transform:translateY(26px) rotate(13deg)}.paper{position:absolute;z-index:8;left:50%;top:78%;transform:translate(-50%,30px) scale(.3);opacity:0;background:#fffefb;border:1px solid #dedbd1;box-shadow:0 12px 35px #26231d21;width:min(300px,76vw);padding:24px 20px;pointer-events:none;transition:transform .7s .35s,opacity .6s .35s}.paper.show{transform:translate(-50%,0) scale(1);opacity:1}.paper .tiny{font-size:9px;letter-spacing:2px;color:#a29c91;font-weight:800}.paper .answer{font-size:clamp(24px,5vw,34px);font-weight:800;margin-top:12px;overflow-wrap:anywhere}.play-status{min-height:26px;color:#79776e;font-size:12px;letter-spacing:.7px}.bottom-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}.edit-panel{max-width:570px;margin:50px auto 0;border-top:1px solid var(--line);padding-top:18px}.edit-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.edit-head h3{font-size:13px;letter-spacing:1px;margin:0}.edit-body{display:none;padding-top:17px}.edit-body.open{display:block}.chips{display:flex;flex-wrap:wrap;gap:9px}.chip{background:#fffefa;border:1px solid #ddd9d0;padding:9px 10px;font-size:12px;display:flex;align-items:center;gap:10px}.chip button{background:none;border:0;color:#9c8b83;font-size:17px;padding:0 3px}.add{display:flex;gap:8px;margin-top:16px}.add input{flex:1;min-width:0;padding:12px;border:1px solid #d5d2c9;background:#fffefa;outline-color:#8b9d87}.add button{border:0;background:#292b27;color:white;padding:0 20px}.hint{font-size:11px;color:#918b83;line-height:1.7}.footer{text-align:center;border-top:1px solid var(--line);padding-top:23px;margin-top:55px;font-size:10px;letter-spacing:2px;color:#aaa49a}.hidden{display:none!important}@keyframes rumble{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}@keyframes fall{0%{transform:translate(-50%,-35px) scale(.4);opacity:0}15%{opacity:1}52%{transform:translate(-50%,103px) scale(1)}66%{transform:translate(-50%,65px) scale(1)}83%{transform:translate(-50%,91px) scale(1)}100%{transform:translate(-50%,83px) scale(1)}}@media(max-width:650px){.shell{padding:19px 17px 40px}.logo{font-size:29px}.top small{font-size:8px;letter-spacing:1px}.hero{padding:35px 0 10px}.hero p{font-size:12px}.scene{min-height:410px}.carousel{height:390px}.machine-card{width:240px}.machine-card.left{transform:translateX(-175px) scale(.68)}.machine-card.right{transform:translateX(175px) scale(.68)}.zoom-frame{height:395px}.zoom-machine{width:270px}.turn-overlay{width:76px;height:76px}.capsule-fall{top:72%}.paper{top:79%}.section-title{margin-top:20px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

</style></head><body><main class="shell"><header class="top"><div class="logo">PICK.</div><small>CAPSULE STUDIO</small></header><div class="hero"><h1>LET'S SPIN.</h1><p>今日の「どうしよう？」を、ガチャで決めよう。</p></div><section id="selection"><div class="section-title">CHOOSE YOUR MACHINE</div><div class="scene"><div class="carousel" id="carousel" aria-label="カテゴリー選択"></div></div><div class="arrows"><button class="round" id="prev" aria-label="前のカテゴリー">‹</button><div class="dots" id="dots"></div><button class="round" id="next" aria-label="次のカテゴリー">›</button></div><div class="actions"><button class="primary" id="choose">このガチャを選ぶ →</button></div></section><section class="play" id="play"><div class="backline"><button class="linkbtn" id="back">← ガチャを選び直す</button></div><h2 id="playTitle">FOOD MACHINE</h2><div class="zoom-frame"><div class="zoom-machine" id="zoomMachine"></div></div><div class="reveal-zone"><div class="capsule-fall" id="fallCapsule" role="button" tabindex="0" aria-label="カプセルを開ける"></div><div class="paper" id="paper"><div class="tiny">TODAY'S PICK</div><div class="answer" id="answer"></div></div></div><p class="play-status" id="status" aria-live="polite">ハンドルをタップして回そう</p><div class="bottom-actions"><button class="primary" id="spinButton">ハンドルを回す</button><button class="secondary hidden" id="openButton">カプセルを開ける</button><button class="secondary hidden" id="again">もう一度回す</button></div></section><section class="edit-panel"><div class="edit-head"><h3>MY OPTIONS <span id="editCat"></span></h3><button class="secondary" id="editToggle" aria-expanded="false">候補を編集 ＋</button></div><div class="edit-body" id="editBody"><p class="hint">候補は最初から用意されています。追加・削除は自由。変更内容はこのブラウザに保存されます。</p><div class="chips" id="chips"></div><form class="add" id="addForm"><input id="newOption" placeholder="候補を入力" maxlength="40" aria-label="新しい候補"><button type="submit">追加</button></form><p class="hint" id="emptyHint"></p></div></section><footer class="footer">PICK. / A LITTLE CHANCE, A LITTLE FUN.</footer></main><script>
'use strict';
const cats=[{key:'food',name:'FOOD',jp:'何を食べる？',body:'#e7dfd1',trim:'#b9a17d',dark:'#aaa08e',caps:['#c7a3a4','#e1c17c','#9db6a6','#b4b6cb'],defaults:['パスタ','お寿司','ラーメン','カレー','ハンバーガー','ピザ','韓国料理','オムライス','うどん','焼肉']},{key:'outing',name:'OUTING',jp:'どこへ行く？',body:'#8ea494',trim:'#c4ad85',dark:'#6f8676',caps:['#c7a3a4','#e0c79b','#d7d9cc','#a8b2ca'],defaults:['映画館','カフェ','美術館','公園','ショッピング','水族館','ドライブ','散歩','カラオケ','動物園']},{key:'fashion',name:'FASHION',jp:'何を着る？',body:'#b8abc5',trim:'#c4ac8e',dark:'#8f839d',caps:['#e6cfce','#c8c0d9','#e0c79b','#a5b8b0'],defaults:['デニム','ワンピース','シャツ','スウェット','ジャケット','ニット','スカート','セットアップ','モノトーン','カーディガン']},{key:'custom',name:'CUSTOM',jp:'自分で決める',body:'#bb8874',trim:'#c9ac82',dark:'#946855',caps:['#c5d1b6','#e4c2ad','#c9b4ca','#dfd2a8'],defaults:[]}];
const storeKey='pick-vintage-options-v1';let options={};try{options=JSON.parse(localStorage.getItem(storeKey)||'{}')||{}}catch(e){options={}}for(const c of cats)if(!Array.isArray(options[c.key]))options[c.key]=[...c.defaults];const save=()=>{try{localStorage.setItem(storeKey,JSON.stringify(options))}catch(e){}};
const $=id=>document.getElementById(id);let index=0,phase='select',pending=null,timers=[];const later=(fn,ms)=>{const id=setTimeout(fn,ms);timers.push(id)};const clearTimers=()=>{timers.forEach(clearTimeout);timers=[]};const escapeHTML=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function capsuleSVG(top,bottom,identifier='cap'){return `<svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="${identifier}-a" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="${top}" stop-opacity=".93"/><stop offset="1" stop-color="${top}"/></linearGradient><linearGradient id="${identifier}-b" x1="0" x2="1"><stop stop-color="#fff" stop-opacity=".6"/><stop offset=".38" stop-color="${bottom}"/><stop offset="1" stop-color="${bottom}"/></linearGradient></defs><g class="cap-top"><path d="M9 50 A41 41 0 0 1 91 50 Z" fill="url(#${identifier}-a)" stroke="#ffffff88" stroke-width="1.5"/><ellipse cx="33" cy="26" rx="15" ry="6" fill="#fff" opacity=".35" transform="rotate(-34 33 26)"/></g><g class="cap-bottom"><path d="M9 50 A41 41 0 0 0 91 50 Z" fill="url(#${identifier}-b)" stroke="#ffffff88" stroke-width="1.5"/><path d="M9 50 H91" stroke="#fff" stroke-width="3" opacity=".8"/><ellipse cx="33" cy="74" rx="13" ry="4" fill="#fff" opacity=".22"/></g></svg>`}
function machineSVG(c,id){const caps=[[91,208,25],[130,219,27],[173,219,28],[210,204,24],[109,174,26],[153,179,28],[193,168,26],[142,141,25]];const capsule=caps.map(([x,y,r],i)=>{const col=c.caps[i%c.caps.length];return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="#ffffff80" stroke-width="2"/><path d="M${x-r} ${y} h${r*2}" stroke="#fff" stroke-opacity=".7" stroke-width="3"/><ellipse cx="${x-7}" cy="${y-10}" rx="${r*.36}" ry="${r*.19}" fill="#fff" opacity=".52" transform="rotate(-35 ${x-7} ${y-10})"/></g>`}).join('');return `<svg class="machine-svg" viewBox="0 0 300 390" role="img" aria-label="${c.name}のガチャガチャ"><defs><linearGradient id="body-${id}" x1="0" y1="0" x2="1" y2=".15"><stop stop-color="#fff" stop-opacity=".55"/><stop offset=".25" stop-color="${c.body}"/><stop offset=".78" stop-color="${c.body}"/><stop offset="1" stop-color="${c.dark}"/></linearGradient><linearGradient id="glass-${id}" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".6"/><stop offset=".25" stop-color="#fff" stop-opacity=".1"/><stop offset=".78" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".42"/></linearGradient><linearGradient id="metal-${id}" x1="0" x2="1"><stop stop-color="#86745f"/><stop offset=".23" stop-color="#f8e9c9"/><stop offset=".48" stop-color="#c2a980"/><stop offset=".72" stop-color="#fff0d0"/><stop offset="1" stop-color="#88745b"/></linearGradient><clipPath id="globe-${id}"><circle cx="150" cy="159" r="107"/></clipPath></defs><ellipse cx="150" cy="366" rx="113" ry="13" fill="#2c281c" opacity=".12"/><path d="M80 253 H220 L248 345 Q250 360 228 360 H72 Q50 360 52 345 Z" fill="url(#body-${id})" stroke="${c.dark}" stroke-opacity=".32" stroke-width="2"/><ellipse cx="150" cy="354" rx="103" ry="13" fill="${c.dark}" opacity=".5"/><path d="M51 346 Q150 367 249 346 L249 355 Q150 376 51 355 Z" fill="${c.trim}"/><circle cx="150" cy="159" r="109" fill="#d9e2dd" fill-opacity=".37" stroke="#b8c3bf" stroke-width="4"/><g clip-path="url(#globe-${id})">${capsule}<circle cx="150" cy="159" r="107" fill="url(#glass-${id})"/><path d="M93 79 Q49 140 83 207" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" opacity=".43"/><path d="M211 94 Q246 148 220 192" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".3"/></g><ellipse cx="150" cy="53" rx="67" ry="11" fill="${c.trim}" opacity=".7"/><path d="M87 51 Q89 27 150 26 Q211 27 213 51 Q151 62 87 51Z" fill="url(#body-${id})" stroke="${c.dark}" stroke-opacity=".3"/><ellipse cx="150" cy="26" rx="10" ry="6" fill="${c.trim}"/><g transform="translate(0 -17)"><rect x="113" y="270" width="74" height="67" rx="7" fill="${c.trim}" opacity=".26"/><circle cx="150" cy="298" r="31" fill="url(#metal-${id})" stroke="#86745f" stroke-width="2"/><circle cx="150" cy="298" r="23" fill="#d5c5a9" stroke="#fff8e4" stroke-width="2"/><g class="turn-rotor"><rect x="121" y="289" width="58" height="18" rx="8" fill="url(#metal-${id})" stroke="#8a775d" stroke-width="2"/><ellipse cx="127" cy="298" rx="5" ry="7" fill="#fff" opacity=".48"/></g></g><path d="M105 362 L105 344 Q105 326 127 326 H173 Q195 326 195 344 L195 362 Z" fill="${c.trim}" stroke="${c.trim}" stroke-width="2"/><path d="M113 360 L113 344 Q113 334 128 334 H172 Q187 334 187 344 L187 360 Z" fill="#353c37"/><path d="M117 358 Q150 349 183 358 L183 362 L117 362 Z" fill="#6d756d" opacity=".55"/></svg>`}
function renderCarousel(){const root=$('carousel');root.innerHTML='';cats.forEach((c,i)=>{let delta=(i-index+4)%4;const pos=delta===0?'center':delta===1?'right':delta===3?'left':'far';const card=document.createElement('div');card.className='machine-card '+pos;card.innerHTML=machineSVG(c,'carousel-'+i)+`<div class="machine-label">${c.name}</div><div class="machine-sub">${c.jp}</div>`;card.addEventListener('click',()=>{if(i!==index){index=i;renderCarousel();renderEdit()}});root.append(card)});$('dots').innerHTML=cats.map((c,i)=>`<button class="dot ${i===index?'active':''}" style="background:${c.body}" data-i="${i}" aria-label="${c.name}を選択"></button>`).join('');$('dots').querySelectorAll('button').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);renderCarousel();renderEdit()})}
function changeIndex(n){index=(index+n+4)%4;renderCarousel();renderEdit()}$('prev').onclick=()=>changeIndex(-1);$('next').onclick=()=>changeIndex(1);let startX=null;$('carousel').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('carousel').addEventListener('touchend',e=>{if(startX!==null){let d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>45)changeIndex(d<0?1:-1)}startX=null},{passive:true});document.addEventListener('keydown',e=>{if(phase==='select'&&e.key==='ArrowLeft')changeIndex(-1);if(phase==='select'&&e.key==='ArrowRight')changeIndex(1)});
function resetPlay(){clearTimers();phase='ready';pending=null;$('fallCapsule').className='capsule-fall';$('fallCapsule').innerHTML='';$('fallCapsule').style.opacity='';$('paper').classList.remove('show');$('answer').textContent='';$('zoomMachine').classList.remove('spinning');$('spinButton').classList.remove('hidden');$('spinButton').disabled=false;$('openButton').classList.add('hidden');$('again').classList.add('hidden');$('status').textContent='ハンドルをタップして回そう'}
function enter(){resetPlay();$('selection').classList.add('hidden');$('play').classList.add('active');const c=cats[index];$('playTitle').textContent=c.name+' MACHINE';$('zoomMachine').innerHTML=machineSVG(c,'zoom-'+index)+`<button class="turn-overlay" aria-label="ハンドルを回す" title="ハンドルを回す"></button>`;$('zoomMachine').querySelector('.turn-overlay').onclick=spin;$('zoomMachine').classList.remove('zoomed');requestAnimationFrame(()=>requestAnimationFrame(()=>$('zoomMachine').classList.add('zoomed')));renderEdit();window.scrollTo({top:0,behavior:'smooth'})}
$('choose').onclick=enter;$('back').onclick=()=>{resetPlay();phase='select';$('selection').classList.remove('hidden');$('play').classList.remove('active');renderCarousel()};
function spin(){if(phase!=='ready')return;const arr=options[cats[index].key];if(!arr.length){$('status').textContent='候補がありません。下の「候補を編集」から追加してね。';$('editBody').classList.add('open');$('editToggle').setAttribute('aria-expanded','true');return}phase='spinning';pending=arr[Math.floor(Math.random()*arr.length)];$('spinButton').disabled=true;$('status').textContent='ガチャガチャを回しています…';$('zoomMachine').classList.add('spinning');later(()=>{if(phase!=='spinning')return;const c=cats[index];const cap=$('fallCapsule');cap.innerHTML=capsuleSVG(c.caps[0],c.caps[1],'result-'+index);cap.className='capsule-fall falling';$('status').textContent='カプセルが出てきた！';later(()=>{if(phase!=='spinning')return;phase='capsule';cap.className='capsule-fall ready';$('spinButton').classList.add('hidden');$('openButton').classList.remove('hidden');$('status').textContent='カプセルをタップして開けよう'},1200)},1200)}$('spinButton').onclick=spin;
function openCapsule(){if(phase!=='capsule')return;phase='opening';$('openButton').classList.add('hidden');$('fallCapsule').className='capsule-fall opening';$('status').textContent='';$('answer').textContent=pending;later(()=>{if(phase!=='opening')return;$('fallCapsule').style.opacity='0';$('paper').classList.add('show');phase='result';$('again').classList.remove('hidden')},650)}$('fallCapsule').onclick=openCapsule;$('fallCapsule').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCapsule()}};$('openButton').onclick=openCapsule;$('again').onclick=()=>{resetPlay();$('zoomMachine').querySelector('.turn-overlay').onclick=spin};
function renderEdit(){const c=cats[index];$('editCat').textContent='/ '+c.name;const list=options[c.key];$('chips').innerHTML='';list.forEach((item,i)=>{const chip=document.createElement('div');chip.className='chip';const txt=document.createElement('span');txt.textContent=item;const btn=document.createElement('button');btn.type='button';btn.textContent='×';btn.setAttribute('aria-label',item+'を削除');btn.onclick=()=>{options[c.key].splice(i,1);save();renderEdit()};chip.append(txt,btn);$('chips').append(chip)});$('emptyHint').textContent=list.length?`${list.length}個の候補が登録されています。`:'候補がありません。1つ以上追加してください。'}$('editToggle').onclick=()=>{const b=$('editBody');b.classList.toggle('open');$('editToggle').setAttribute('aria-expanded',String(b.classList.contains('open')))};$('addForm').onsubmit=e=>{e.preventDefault();const input=$('newOption');const v=input.value.trim();if(!v)return;if(options[cats[index].key].includes(v)){input.setCustomValidity('すでに登録されています');input.reportValidity();input.setCustomValidity('');return}options[cats[index].key].push(v);save();input.value='';renderEdit()};renderCarousel();renderEdit();
</script></body></html>
